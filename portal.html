<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div style="width:95%;max-width:1100px;margin:30px auto;">

    <h1>📡 Radio Portal</h1>
    <p>Archivio personale frequenze radio</p>

    <input
        type="text"
        placeholder="🔍 Cerca una frequenza..."
        style="width:100%;padding:15px;margin:20px 0;border-radius:10px;border:none;">

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;">

        <div class="login-container">
            <div class="logo">🚒</div>
            <h2>Vigili del Fuoco</h2>
            <p>Archivio frequenze</p>
        </div>

        <div class="login-container">
            <div class="logo">🚑</div>
            <h2>118</h2>
            <p>Archivio frequenze</p>
        </div>

        <div class="login-container">
            <div class="logo">🚓</div>
            <h2>Protezione Civile</h2>
            <p>Archivio frequenze</p>
        </div>

        <div class="login-container">
            <div class="logo">🌲</div>
            <h2>AIB</h2>
            <p>Archivio frequenze</p>
        </div>

        <div class="login-container">
            <div class="logo">📻</div>
            <h2>Radioamatori</h2>
            <p>Ponti e frequenze</p>
        </div>

        <div class="login-container">
            <div class="logo">🚢</div>
            <h2>Nautica</h2>
            <p>Canali VHF</p>
        </div>

    </div>

</div>

</body>
</html>
